unbind r
bind r source-file ~/.tmux.conf

# Terminal capabilities used by WezTerm and Kitty.
set -g default-terminal "tmux-256color"
set -gu terminal-overrides
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# Let modern terminal protocols, including Kitty graphics, traverse tmux.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Human-facing numbering: windows and panes begin at 1.
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
set-option -g status-position top

# Nyx palette rendered through the Catppuccin status components.
source-file ~/.tmux/themes/nyx.conf
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

run '~/.tmux/plugins/tpm/tpm'
