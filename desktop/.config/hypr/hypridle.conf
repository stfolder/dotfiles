general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# Lock after ten idle minutes on both battery and external power. Applications
# holding a proper idle inhibitor (video, presentation, game) postpone it.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Preserve battery-saving behavior when unplugged, but keep the panel awake
# indefinitely while external power is available. systemd-ac-power exits 0 on
# AC/external power, so the action after || runs only while on battery.
listener {
    timeout = 660
    on-timeout = systemd-ac-power || hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = systemd-ac-power || systemctl suspend
}
