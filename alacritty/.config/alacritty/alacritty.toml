[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]
[env]
TERM = "xterm-256color"
[window]
opacity = 0.8
decorations = "none"

[window.padding]
x = 7
y = 0

[font]
size = 10.0

[font.normal]
family = "MesloLGS Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"
