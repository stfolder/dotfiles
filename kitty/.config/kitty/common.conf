# Typography
font_family      JetBrainsMono Nerd Font
font_size        18.0
disable_ligatures never

# Nyx: dark-only, translucent, quiet chrome
include themes/nyx.conf
background_opacity         0.90
dynamic_background_opacity yes
window_padding_width       8
tab_bar_style              hidden

# Terminal behavior
# Attach by default; after detaching, remain in a regular login shell.
shell zsh -l -c "tmux new-session -A -s base; exec zsh -l"
confirm_os_window_close 0
scrollback_lines 10000
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no

# Keep tmux as the one session/pane vocabulary.
map ctrl+shift+enter no_op
map ctrl+shift+t     no_op

# Familiar controls from the previous terminal setup.
map ctrl+shift+o      remote_control set-background-opacity --toggle 0.90
map ctrl+shift+e      disable_ligatures_in active cursor
map cmd+,             edit_config_file
map ctrl+shift+comma  edit_config_file
map ctrl+shift+period launch --type=os-window --cwd=current zsh -l
map ctrl+shift+n      new_os_window
map ctrl+n            no_op
